units:
  # v0.3: шаг под кейкапы PG1316S (16×16 мм) — 17×17 мм, зазор между кейкапами 1 мм
  ku: 17
points:
  key:
    spread: ku
    padding: ku
    tags:
      - key
  zones:
    matrix:
      anchor:
        shift: [150, -150] # Fix KiCad placement
      columns:
        c1:
        c2:
        c3.key.stagger: ku/4
        c4.key.stagger: ku/8
        c5.key.stagger: -ku/8
        c6.key.stagger: -ku/8
      rows:
        r3:
        r2:
        r1:
    thumbfan:
      # три клавиши на одной прямой с наклоном; первая — там же относительно c4, что и в v0.2 (в масштабе 17/19)
      anchor:
        - ref: matrix_c4_r3
          shift: [8.5,-19.7]
          rotate: -10
      columns:
        c4:
        c5:
        c6:
      rows:
        r0:
    mcu:
      key.tags:
        - helper
      anchor:
        # XIAO лёжа под нижним рядом c1–c2, USB-C смотрит наружу (влево) и чуть выходит за край
        - ref: matrix_c1_r3
          shift: [-ku/2+10.8, -ku/2-10.4]
    screw_1:
      key.tags:
        - helper
        - screw
      anchor:
        # свободная зона между контроллером и рядом большого пальца
        ref: matrix_c1_r3
        shift: [21.25,-14]
    screw_2:
      key.tags:
        - helper
        - screw
      anchor:
        ref: matrix_c1_r3
        shift: [43,-12]
    screw_3:
      key.tags:
        - helper
        - screw
      anchor:
        # у правого края, на стыке c6 и крайней клавиши большого пальца
        # (между c5 и средней клавишей головка M2 под кейкап не влезает)
        ref: matrix_c1_r3
        shift: [93,-8.4]
outlines:
  _keycaps:
    - what: rectangle
      where: [key]
      size: 16
      fillet: 1.5
  _mcu:
    - what: rectangle
      where: [mcu]
      size: [21,17.8]
      fillet: 1
    - what: rectangle
      where: [mcu]
      size: [7.4,9]
      operation: stack
      adjust:
        shift: [-10.5+7.4/2-1.4,0]
  _screw_heads:
    - what: circle
      where: [screw]
      radius: 3.8/2
  board:
    - what: rectangle
      where: [key]
      size: ku
    # запас 1.6 мм справа от внутренней колонки — там стоят диоды c6
    - what: rectangle
      where: [matrix_c6_r1]
      size: [1.6,3ku]
      adjust:
        shift: [ku/2+1.6/2,-ku]
    - what: polygon
      points:
        - ref: matrix_c1_r3
          shift: [-ku/2,ku/2]
          affect: [x,y]
        - ref: matrix_c1_r3
          shift: [-ku/2,-ku/2-20.5]
          affect: [x,y]
        # ровный низ под контроллером и выключателем
        - ref: matrix_c1_r3
          shift: [36,-ku/2-20.5]
          affect: [x,y]
        # дальше край идёт по низу ряда большого пальца с запасом 1.6 мм
        - ref: thumbfan_c4_r0
          shift: [-ku/2,-ku/2-1.6]
          affect: [x,y]
        - ref: thumbfan_c6_r0
          shift: [ku/2+1.6,-ku/2-1.6]
          affect: [x,y]
        - ref: thumbfan_c6_r0
          shift: [ku/2+1.6,ku/2]
          affect: [x,y]
        - ref: matrix_c6_r3
          shift: [ku/2+1.6,-ku/2]
          affect: [x,y]
        - ref: matrix_c6_r2
          affect: [x,y]
        - ref: matrix_c1_r2
          affect: [x,y]
  preview:
    - what: outline
      name: board
    - what: outline
      name: _keycaps
      operation: stack
    - what: outline
      name: _mcu
      operation: stack
    - what: outline
      name: _screw_heads
      operation: stack
pcbs:
  clumsy_pcb:
    template: kicad8
    outlines:
      board:
        outline: board
    footprints:
      m2_screws:
        what: ceoloide/mounting_hole_npth
        where: /screw/
        params:
          hole_size: 2.2
          hole_drill: 2.2
      switches:
        what: clumsy/switch_pg1316s
        where: /key/
        params:
          from: "{{colrow}}"
          to: "{{col.name}}"
          reversible: true
      diodes:
        # на стороне, противоположной свитчам: справа от свитча, в щели между клавишами
        what: clumsy/diode_sod123
        where: /key/
        params:
          from: "{{colrow}}"
          to: "{{row}}"
          reversible: true
        adjust:
          shift: [ku/2,0]
          rotate: 90
      mcu:
        what: clumsy/mcu_xiao_smd
        where: mcu
        params:
          reversible: true
          # колонки — верхний по схеме ряд площадок (D0–D5), ряды — нижний (D6–D9); P115 (D10) свободен
          P002: c1
          P003: c2
          P028: c3
          P029: c4
          P004: c5
          P005: c6
          P111: r0
          P112: r1
          P113: r2
          P114: r3
          raw: RAW
          rst: RST
      battery:
        # батарея 502030 лежит на обороте; провода припаиваются сюда
        what: clumsy/battery_pads
        where: matrix_c1_r3
        params:
          pos: BAT_P
          neg: GND
        adjust:
          shift: [32.5,-13]
      on_off_switch:
        what: ceoloide/power_switch_smd_side
        where: matrix_c1_r3
        params:
          from: BAT_P
          to: RAW
          reversible: true
        adjust:
          # на нижнем торце справа от контроллера, рычажок смотрит вниз; 1.85 — площадки ≥0.3 мм от края
          shift: [20,-ku/2-20.5+1.85]
          rotate: -90
      reset_switch:
        what: ceoloide/reset_switch_tht_top
        where: matrix_c1_r3
        params:
          from: GND
          to: RST
        adjust:
          shift: [28,-20]
          rotate: 90
